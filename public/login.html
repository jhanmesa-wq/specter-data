<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPECTER DATA — inicio sesión</title>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg-dark:#0a0f18;--card-bg:#101726;--input-bg:#141c2c;
  --input-border:#222d42;--text-muted:#8893a7;
  --accent-blue:#ff6b24;--accent-blue-hover:#e85a19;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:
  radial-gradient(ellipse at 15% 15%,rgba(255,107,36,.14),transparent 38%),
  radial-gradient(ellipse at 85% 85%,rgba(255,107,36,.09),transparent 40%),
  var(--bg-dark);
  color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:64px 20px 24px;
}
.back-link{position:absolute;top:24px;left:24px;color:var(--text-muted);text-decoration:none;font-size:14px;transition:.2s}
.back-link:hover{color:#fff}
.auth-box,.dashboard-box{
  width:100%;max-width:440px;background:rgba(16,23,38,.94);
  border:1px solid rgba(255,107,36,.25);border-radius:22px;padding:30px;
  box-shadow:0 24px 70px rgba(0,0,0,.45);backdrop-filter:blur(14px);
  animation:appear .35s ease-out;
}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.logo-container{display:flex;align-items:center;justify-content:center;margin-bottom:22px;min-height:62px}
.banner-img{display:none;width:100%;max-height:140px;object-fit:contain;border-radius:12px}
.logo-fallback{display:flex;align-items:center;justify-content:center;gap:13px}
.logo-icon{width:48px;height:48px;filter:drop-shadow(0 0 10px rgba(255,107,36,.4))}
.brand-name{font-size:25px;font-weight:800;letter-spacing:1.4px;color:#fff}
h1,h2{font-size:25px;font-weight:750;margin-bottom:8px;text-align:center}
.subtitle{text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:24px}
.tabs{display:flex;background:var(--input-bg);border-radius:12px;padding:4px;margin-bottom:22px;border:1px solid var(--input-border);gap:4px}
.tab-btn{flex:1;padding:11px 8px;border:0;background:transparent;color:var(--text-muted);font-weight:650;font-size:14px;border-radius:9px;cursor:pointer;transition:.2s}
.tab-btn.active{background:var(--accent-blue);color:#fff}
.form-group{margin-bottom:15px;text-align:left}
.field-label{display:block;color:#dce5f3;font-size:13px;font-weight:600;margin:0 0 8px 3px}
.input-wrap{position:relative}
input[type=email],input[type=password],input[type=text]{
  width:100%;padding:15px 16px;background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:12px;color:#fff;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s
}
input:focus{border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(255,107,36,.15)}
input::placeholder{color:#64728a}
.password-input{padding-right:48px!important}
.toggle-password{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:0;color:#8893a7;cursor:pointer;font-size:16px}
.toggle-password:hover{color:#fff}
.form-options{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 1px 18px;font-size:13px;color:#aab5c7}
.remember{display:flex;align-items:center;gap:7px;cursor:pointer}
.remember input{accent-color:var(--accent-blue)}
.text-button{border:0;background:none;color:#ff8a4c;cursor:pointer;font-size:13px}
.text-button:hover{text-decoration:underline}
.btn-submit,.btn-google{
  width:100%;padding:15px;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
  transition:background .2s,transform .15s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:10px
}
.btn-submit{background:var(--accent-blue);color:#fff}
.btn-submit:hover{background:var(--accent-blue-hover);box-shadow:0 8px 24px rgba(255,107,36,.25)}
.btn-submit:active,.btn-google:active{transform:scale(.99)}
.btn-google{margin-top:15px;background:#fff;color:#293447}
.btn-google:hover{background:#eaf3fb}
.btn-submit:disabled,.btn-google:disabled{opacity:.65;cursor:wait}
.google-icon{width:18px;height:18px}
.divider{display:flex;align-items:center;gap:12px;color:#718099;font-size:10px;font-weight:700;letter-spacing:1px;margin:21px 0 0}
.divider:before,.divider:after{content:"";height:1px;background:var(--input-border);flex:1}
.message{display:none;margin-top:15px;font-size:13px;padding:11px 12px;border-radius:9px;line-height:1.45}
.message.show{display:block}
.message.error{background:rgba(239,68,68,.13);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.message.success{background:rgba(34,197,94,.13);color:#86efac;border:1px solid rgba(34,197,94,.25)}
.message.info{background:rgba(255,107,36,.13);color:#ffab7a;border:1px solid rgba(255,107,36,.25)}
.terms{text-align:center;color:#68758b;font-size:11px;line-height:1.5;margin-top:20px}
.loader{width:17px;height:17px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.dashboard-box{max-width:520px}
.dashboard-icon{width:66px;height:66px;border-radius:20px;background:rgba(255,107,36,.16);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#ff6b24;font-size:27px}
.account-card{background:var(--input-bg);border:1px solid var(--input-border);border-radius:14px;padding:18px;margin:22px 0}
.account-row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.account-row:last-child{border-bottom:0}
.account-row span:first-child{color:var(--text-muted)}
.account-row span:last-child{text-align:right;overflow-wrap:anywhere}
@media(max-width:480px){body{padding:60px 14px 18px}.auth-box,.dashboard-box{padding:23px 19px}.back-link{top:18px;left:16px}.brand-name{font-size:22px}}
</style>
</head>
<body>
<a href="index.html" class="back-link">← Volver al sitio principal</a>

<audio id="bgMusic" loop preload="auto"></audio>

<div class="auth-box" id="authContainer">
  <div class="logo-container">
    <img class="banner-img" id="bannerImg" alt="SPECTER DATA">
    <div class="logo-fallback" id="logoFallback">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="#ff6b24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2a4 4 0 0 0-4 4v1H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z"/>
        <circle cx="12" cy="13" r="3"/><path d="M12 16v2"/>
      </svg>
      <span class="brand-name">SPECTER DATA</span>
    </div>
  </div>

  <h1 id="formTitle">Bienvenido de nuevo</h1>
  <p class="subtitle" id="formSubtitle">Ingresa con tu cuenta para continuar</p>

  <div class="tabs">
    <button class="tab-btn active" id="loginTab" type="button">Ingresar</button>
    <button class="tab-btn" id="registerTab" type="button">Registrarse</button>
  </div>

  <div id="alertBox" class="message" role="status" aria-live="polite"></div>

  <form id="loginForm">
    <div class="form-group">
      <label class="field-label" for="loginEmail">Correo electrónico</label>
      <input type="email" id="loginEmail" placeholder="tu@email.com" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label class="field-label" for="loginPassword">Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="loginPassword" class="password-input" placeholder="Tu contraseña" autocomplete="current-password" required>
        <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Mostrar contraseña">◉</button>
      </div>
    </div>
    <div class="form-options">
      <label class="remember"><input type="checkbox" id="rememberMe" checked> Recordarme</label>
      <button type="button" id="forgotPassword" class="text-button">¿Olvidaste tu contraseña?</button>
    </div>
    <button type="submit" id="loginBtn" class="btn-submit">
      <span id="loginBtnText">Ingresar</span><span id="loginBtnLoader" class="loader hidden"></span>
    </button>
  </form>

  <form id="registerForm" class="hidden">
    <div class="form-group">
      <label class="field-label" for="registerName">Nombre completo</label>
      <input type="text" id="registerName" placeholder="Tu nombre" autocomplete="name" maxlength="80" required>
    </div>
    <div class="form-group">
      <label class="field-label" for="registerEmail">Correo electrónico</label>
      <input type="email" id="registerEmail" placeholder="tu@email.com" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label class="field-label" for="registerPassword">Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="registerPassword" class="password-input" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
        <button type="button" class="toggle-password" data-target="registerPassword" aria-label="Mostrar contraseña">◉</button>
      </div>
    </div>
    <div class="form-group">
      <label class="field-label" for="registerConfirmPassword">Confirmar contraseña</label>
      <div class="input-wrap">
        <input type="password" id="registerConfirmPassword" class="password-input" placeholder="Repite tu contraseña" autocomplete="new-password" required>
        <button type="button" class="toggle-password" data-target="registerConfirmPassword" aria-label="Mostrar contraseña">◉</button>
      </div>
    </div>
    <button type="submit" id="registerBtn" class="btn-submit">
      <span id="registerBtnText">Crear cuenta</span><span id="registerBtnLoader" class="loader hidden"></span>
    </button>
  </form>

  <div class="divider">O CONTINÚA CON</div>
  <button id="googleBtn" type="button" class="btn-google">
    <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    <span id="googleBtnText">Continuar con Google</span><span id="googleBtnLoader" class="loader hidden"></span>
  </button>
  <p class="terms">Al continuar, aceptas nuestros Términos de Servicio y Política de Privacidad.</p>
</div>



<script>
const CONFIG = {
  BANNER_URL: "https://files.catbox.moe/x01jky.jpg",
  MUSIC_URL: "",
  MUSIC_VOLUME: 0.45
};

const firebaseConfig = {
  apiKey: "AIzaSyBKvWZ2jQ0lyrx5xSjFj7fmBaJL1wvBBvU",
  authDomain: "specter-data.firebaseapp.com",
  projectId: "specter-data",
  storageBucket: "specter-data.firebasestorage.app",
  messagingSenderId: "1073862554181",
  appId: "1:1073862554181:web:11d724e7ba0e817885a92c",
  measurementId: "G-28FMY2SW1H"
};

const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();

const $ = id => document.getElementById(id);
const authContainer = $("authContainer");
const loginForm = $("loginForm");
const registerForm = $("registerForm");
const alertBox = $("alertBox");

// Banner
(function initBanner(){
  if (!CONFIG.BANNER_URL) return;
  const img = $("bannerImg"), fallback = $("logoFallback");
  img.onload = () => { img.style.display = "block"; fallback.style.display = "none"; };
  img.onerror = () => { img.style.display = "none"; fallback.style.display = "flex"; };
  img.src = CONFIG.BANNER_URL;
})();

// Música configurada desde Render mediante /api/config.
// El navegador puede bloquear la reproducción automática hasta la primera interacción.
(async function initMusic(){
  let musicUrl = CONFIG.MUSIC_URL;

  try {
    const response = await fetch('/api/config', {
      credentials: 'same-origin',
      cache: 'no-store'
    });
    if (response.ok) {
      const settings = await response.json();
      if (settings.musicUrl) musicUrl = settings.musicUrl;
    }
  } catch (error) {
    console.warn('No se pudo cargar la música configurada en el servidor.');
  }

  if (!musicUrl) return;

  const audio = $('bgMusic');
  audio.src = musicUrl;
  audio.volume = Math.min(1, Math.max(0, Number(CONFIG.MUSIC_VOLUME) || 0.45));

  const start = () => audio.play().catch(() => {});
  start();

  const resume = () => {
    if (audio.paused) start();
  };

  document.addEventListener('pointerdown', resume, { once: true, passive: true });
  document.addEventListener('keydown', resume, { once: true });
  document.addEventListener('touchstart', resume, { once: true, passive: true });
})();

function showAlert(message, type="error"){
  alertBox.textContent = message;
  alertBox.className = "message show " + type;
}
function hideAlert(){
  alertBox.textContent = "";
  alertBox.className = "message";
}
function setLoading(buttonId, isLoading){
  const btn = $(buttonId);
  const text = $(buttonId + "Text");
  const loader = $(buttonId + "Loader");
  if(!btn) return;
  btn.disabled = isLoading;
  if(text) text.classList.toggle("hidden", isLoading);
  if(loader) loader.classList.toggle("hidden", !isLoading);
}

function getErrorMessage(error){
  const messages = {
    "auth/email-already-in-use":"Este correo ya está registrado.",
    "auth/invalid-email":"Correo electrónico inválido.",
    "auth/operation-not-allowed":"Operación no permitida en Firebase.",
    "auth/weak-password":"La contraseña debe tener al menos 8 caracteres.",
    "auth/user-disabled":"Esta cuenta ha sido deshabilitada.",
    "auth/user-not-found":"No existe una cuenta con este correo.",
    "auth/wrong-password":"Contraseña incorrecta.",
    "auth/invalid-credential":"Correo o contraseña incorrectos.",
    "auth/too-many-requests":"Demasiados intentos. Intenta más tarde.",
    "auth/network-request-failed":"Error de conexión. Verifica tu internet."
  };
  return messages[error?.code] || (error?.message || "Error al procesar la solicitud.");
}

// Guardar datos en Firestore en segundo plano (sin bloquear login)
function saveUserToFirestore(user, name=null){
  return new Promise((resolve) => {
    const timer = setTimeout(() => resolve(), 1500);
    try{
      const userRef = db.collection("users").doc(user.uid);
      userRef.get().then(userSnap => {
        if(!userSnap.exists){
          return userRef.set({
            uid: user.uid,
            email: user.email,
            displayName: name || user.displayName || "Usuario",
            photoURL: user.photoURL || null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
            provider: user.providerData[0]?.providerId || "password"
          });
        }else{
          return userRef.set({
            lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
            ...(name ? {displayName:name} : {})
          },{merge:true});
        }
      }).catch(e => console.warn("Firestore info:", e))
        .finally(() => { clearTimeout(timer); resolve(); });
    }catch(err){
      clearTimeout(timer);
      resolve();
    }
  });
}

// Llamada al backend de Render. La sesión real es la cookie HttpOnly specter_session.
async function requestServerAuth(endpoint, bodyData){
  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      cache: "no-store",
      body: JSON.stringify(bodyData)
    });
    const data = await res.json().catch(()=>({}));
    return { ok: res.ok, status: res.status, data };
  } catch(e) {
    return { ok: false, error: e.message, data: {} };
  }
}

// DETECCIÓN DE PARÁMETROS
const urlParams = new URLSearchParams(window.location.search);
const hasExpiredParam = urlParams.get("expired") === "1";

if(hasExpiredParam){
  auth.signOut().catch(()=>{});
  localStorage.removeItem("specter_token");
  showAlert("Tu sesión en el servidor ha expirado. Por favor ingresa nuevamente.", "error");
}

// Pestañas
$("loginTab").addEventListener("click",()=>{
  $("loginTab").classList.add("active");
  $("registerTab").classList.remove("active");
  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");
  $("formTitle").textContent="Bienvenido de nuevo";
  $("formSubtitle").textContent="Ingresa con tu cuenta para continuar";
  hideAlert();
});
$("registerTab").addEventListener("click",()=>{
  $("registerTab").classList.add("active");
  $("loginTab").classList.remove("active");
  registerForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
  $("formTitle").textContent="Crea tu cuenta";
  $("formSubtitle").textContent="Regístrate para acceder a SPECTER DATA";
  hideAlert();
});

// Ver/ocultar contraseñas
document.querySelectorAll(".toggle-password").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const field=$(btn.dataset.target);
    field.type = field.type === "password" ? "text" : "password";
    btn.textContent = field.type === "password" ? "◉" : "◎";
  });
});

// INICIO DE SESIÓN: el servidor Express/MongoDB es la fuente de verdad.
loginForm.addEventListener("submit", async e => {
  e.preventDefault();
  hideAlert();
  setLoading("loginBtn", true);

  const email = $("loginEmail").value.trim().toLowerCase();
  const password = $("loginPassword").value;
  const rememberMe = $("rememberMe").checked;

  try {
    let serverRes = await requestServerAuth("/api/auth/login", { email, password });

    // Compatibilidad con cuentas antiguas que existían en Firebase, pero todavía no en MongoDB.
    if (!serverRes.ok) {
      let legacyFirebaseUser = null;

      try {
        await auth.setPersistence(
          rememberMe
            ? firebase.auth.Auth.Persistence.LOCAL
            : firebase.auth.Auth.Persistence.SESSION
        );
        const legacyCredential = await auth.signInWithEmailAndPassword(email, password);
        legacyFirebaseUser = legacyCredential.user;
      } catch (firebaseError) {
        console.warn("Acceso Firebase heredado no disponible:", firebaseError?.code || firebaseError?.message);
      }

      if (legacyFirebaseUser) {
        const migration = await requestServerAuth("/api/auth/register", {
          email,
          password,
          name: legacyFirebaseUser.displayName || email.split("@")[0]
        });

        if (migration.ok) {
          serverRes = migration;
          saveUserToFirestore(legacyFirebaseUser);
        }
      }
    }

    if (!serverRes.ok) {
      throw new Error(serverRes.data?.error || serverRes.error || "No se pudo iniciar sesión.");
    }

    const verify = await fetch("/api/me", {
      method: "GET",
      credentials: "include",
      cache: "no-store",
      headers: { "Cache-Control": "no-cache" }
    });

    if (!verify.ok) {
      const detail = await verify.json().catch(() => ({}));
      throw new Error(detail.error || "El servidor creó la sesión, pero el navegador no recibió la cookie. Comprueba que login y consultas estén en el mismo dominio.");
    }

    // Firebase queda como sincronización secundaria; nunca bloquea la sesión de Render.
    auth.setPersistence(
      rememberMe
        ? firebase.auth.Auth.Persistence.LOCAL
        : firebase.auth.Auth.Persistence.SESSION
    ).then(() => auth.signInWithEmailAndPassword(email, password))
      .then(credential => saveUserToFirestore(credential.user))
      .catch(error => console.warn("Sincronización opcional de Firebase:", error?.code || error?.message));

    window.location.replace("consultas.html");
  } catch(error) {
    showAlert(error.message || getErrorMessage(error), "error");
  } finally {
    setLoading("loginBtn", false);
  }
});

// REGISTRO: se crea la cuenta y la cookie directamente en el servidor.
registerForm.addEventListener("submit", async e => {
  e.preventDefault();
  hideAlert();

  const name = $("registerName").value.trim();
  const email = $("registerEmail").value.trim().toLowerCase();
  const password = $("registerPassword").value;
  const confirmPassword = $("registerConfirmPassword").value;

  if (password !== confirmPassword) {
    showAlert("Las contraseñas no coinciden.", "error");
    return;
  }
  if (password.length < 8) {
    showAlert("La contraseña debe tener al menos 8 caracteres.", "error");
    return;
  }

  setLoading("registerBtn", true);

  try {
    const regRes = await requestServerAuth("/api/auth/register", { email, password, name });

    if (!regRes.ok) {
      throw new Error(regRes.data?.error || regRes.error || "No se pudo registrar la cuenta.");
    }

    const verify = await fetch("/api/me", {
      method: "GET",
      credentials: "include",
      cache: "no-store",
      headers: { "Cache-Control": "no-cache" }
    });

    if (!verify.ok) {
      const detail = await verify.json().catch(() => ({}));
      throw new Error(detail.error || "La cuenta se creó, pero no se pudo confirmar la sesión del servidor.");
    }

    // Crear/sincronizar perfil Firebase de forma secundaria, sin detener el acceso.
    auth.createUserWithEmailAndPassword(email, password)
      .then(async credential => {
        await credential.user.updateProfile({ displayName: name });
        saveUserToFirestore(credential.user, name);
      })
      .catch(error => console.warn("Sincronización opcional de Firebase:", error?.code || error?.message));

    showAlert("Cuenta creada correctamente. Entrando...", "success");
    window.location.replace("consultas.html");
  } catch(error) {
    showAlert(error.message || getErrorMessage(error), "error");
  } finally {
    setLoading("registerBtn", false);
  }
});

// GOOGLE AUTH
$("googleBtn").addEventListener("click", async () => {
  hideAlert();
  setLoading("googleBtn", true);
  try {
    const result = await auth.signInWithPopup(googleProvider);
    saveUserToFirestore(result.user);

    // Conectar con endpoint Google si está habilitado
    const googleSession = await fetch("/api/me", { credentials: "same-origin", cache: "no-store" });
    if (googleSession.ok) {
      window.location.replace("consultas.html");
    } else {
      showAlert("Google inició sesión en Firebase, pero esta cuenta todavía no tiene una sesión válida en SPECTER DATA. Usa el acceso con correo y contraseña.", "error");
    }
  } catch(error) {
    if(error.code !== "auth/popup-closed-by-user") showAlert(getErrorMessage(error), "error");
  } finally {
    setLoading("googleBtn", false);
  }
});

// RECUPERAR CONTRASEÑA
$("forgotPassword").addEventListener("click", async () => {
  const email = $("loginEmail").value.trim();
  if(!email){
    showAlert("Ingresa tu correo electrónico en el campo superior primero.", "info");
    return;
  }
  try {
    await auth.sendPasswordResetEmail(email);
    showAlert("Se envió un correo para restablecer tu contraseña.", "success");
  } catch(error) {
    showAlert(getErrorMessage(error), "error");
  }
});

// CERRAR SESIÓN / VERIFICAR SESIÓN DEL SERVIDOR
// Una sesión de Firebase por sí sola nunca muestra una pantalla intermedia ni concede acceso.
auth.onAuthStateChanged(async () => {
  if (hasExpiredParam) return;

  try {
    const serverCheck = await fetch("/api/me", {
      credentials: "include",
      cache: "no-store",
      headers: { "Cache-Control": "no-cache" }
    });

    if (serverCheck.ok) {
      window.location.replace("consultas.html");
      return;
    }
  } catch(error) {
    console.warn("No se pudo comprobar una sesión previa de SPECTER DATA.");
  }

  authContainer.classList.remove("hidden");
});

// También comprobar la cookie aunque Firebase no tenga una sesión activa.
(async function checkServerSessionOnLoad(){
  if (hasExpiredParam) return;

  try {
    const response = await fetch("/api/me", {
      credentials: "include",
      cache: "no-store",
      headers: { "Cache-Control": "no-cache" }
    });
    if (response.ok) window.location.replace("consultas.html");
  } catch(error) {
    console.warn("No se pudo comprobar la sesión del servidor.");
  }
})();
</script>
