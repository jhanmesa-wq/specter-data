<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specter Auth | Acceso Seguro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    @import none;
    
    * {
        font-family: 'Inter', sans-serif;
    }
    
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        background-image: none;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
    }
    
    .glass {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }
    
    .glass-input {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
    }
    
    .glass-input:focus {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        outline: none;
    }
    
    .btn-gradient {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        transition: all 0.3s ease;
    }
    
    .btn-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-google {
        background: rgba(255, 255, 255, 0.95);
        transition: all 0.3s ease;
    }
    
    .btn-google:hover {
        background: rgba(255, 255, 255, 1);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    
    .tab-active {
        background: rgba(255, 255, 255, 0.2);
        border-bottom: 2px solid rgba(255, 255, 255, 0.8);
    }
    
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .slide-in {
        animation: slideIn 0.3s ease-out;
    }
    
    .loader {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid #fff;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @media (max-width: 390px) {
        .auth-container {
            margin: 1rem;
        }
    }
</style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">
    
    <div id="authContainer" class="auth-container w-full max-w-md">
        <div class="glass rounded-3xl p-8 slide-in">
            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/20 mb-4">
                    <i class="fas fa-shield-halved text-white text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Specter Data</h1>
                <p class="text-white/70 text-sm">Acceso seguro a tu cuenta</p>
            </div>

            <!-- Tabs -->
            <div class="flex gap-2 mb-6 rounded-xl bg-white/10 p-1">
                <button id="loginTab" class="flex-1 py-2.5 px-4 rounded-lg text-white font-medium text-sm transition-all tab-active">
                    Iniciar Sesión
                </button>
                <button id="registerTab" class="flex-1 py-2.5 px-4 rounded-lg text-white/70 font-medium text-sm transition-all">
                    Registrarse
                </button>
            </div>

            <!-- Alert Messages -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-sm slide-in"></div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">
                        <i class="fas fa-envelope text-xs mr-2"></i>Correo electrónico
                    </label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-white/50 text-sm"
                        placeholder="tu@email.com"
                        required>
                </div>
                
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">
                        <i class="fas fa-lock text-xs mr-2"></i>Contraseña
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="loginPassword" 
                            class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-white/50 text-sm pr-12"
                            placeholder="••••••••"
                            required>
                        <button type="button" class="toggle-password absolute right-4 top-1/2 -translate-y-1/2 text-white/60 hover:text-white" data-target="loginPassword">
                            <i class="fas fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-white/80 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="mr-2 rounded">
                        Recordarme
                    </label>
                    <button type="button" id="forgotPassword" class="text-white/80 hover:text-white font-medium">
                        ¿Olvidaste tu contraseña?
                    </button>
                </div>

                <button type="submit" id="loginBtn" class="btn-gradient w-full py-3.5 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2">
                    <span id="loginBtnText">Iniciar Sesión</span>
                    <div id="loginLoader" class="loader hidden"></div>
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">
                        <i class="fas fa-user text-xs mr-2"></i>Nombre completo
                    </label>
                    <input 
                        type="text" 
                        id="registerName" 
                        class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-white/50 text-sm"
                        placeholder="Juan Pérez"
                        required>
                </div>

                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">
                        <i class="fas fa-envelope text-xs mr-2"></i>Correo electrónico
                    </label>
                    <input 
                        type="email" 
                        id="registerEmail" 
                        class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-white/50 text-sm"
                        placeholder="tu@email.com"
                        required>
                </div>
                
                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">
                        <i class="fas fa-lock text-xs mr-2"></i>Contraseña
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="registerPassword" 
                            class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-white/50 text-sm pr-12"
                            placeholder="Mínimo 6 caracteres"
                            required>
                        <button type="button" class="toggle-password absolute right-4 top-1/2 -translate-y-1/2 text-white/60 hover:text-white" data-target="registerPassword">
                            <i class="fas fa-eye text-sm"></i>
                        </button>
                    </div>
                    <p class="text-white/60 text-xs mt-1.5">Mínimo 6 caracteres</p>
                </div>

                <div>
                    <label class="block text-white/90 text-sm font-medium mb-2">
                        <i class="fas fa-lock text-xs mr-2"></i>Confirmar contraseña
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="registerConfirmPassword" 
                            class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-white/50 text-sm pr-12"
                            placeholder="••••••••"
                            required>
                        <button type="button" class="toggle-password absolute right-4 top-1/2 -translate-y-1/2 text-white/60 hover:text-white" data-target="registerConfirmPassword">
                            <i class="fas fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="registerBtn" class="btn-gradient w-full py-3.5 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2">
                    <span id="registerBtnText">Crear Cuenta</span>
                    <div id="registerLoader" class="loader hidden"></div>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-white/20"></div>
                <span class="text-white/60 text-xs font-medium">O CONTINÚA CON</span>
                <div class="flex-1 h-px bg-white/20"></div>
            </div>

            <!-- Google Button -->
            <button id="googleBtn" class="btn-google w-full py-3.5 rounded-xl text-gray-700 font-semibold text-sm flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span id="googleBtnText">Continuar con Google</span>
                <div id="googleLoader" class="loader hidden border-gray-400 border-t-gray-700"></div>
            </button>

            <p class="text-center text-white/50 text-xs mt-6">
                Al continuar, aceptas nuestros Términos de Servicio y Política de Privacidad
            </p>
        </div>
    </div>

    <!-- Dashboard - Se muestra después de login -->
    <div id="dashboardContainer" class="hidden w-full max-w-2xl">
        <div class="glass rounded-3xl p-8 slide-in">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-white/20 mb-4">
                    <i class="fas fa-user-check text-white text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-white mb-2">¡Bienvenido!</h2>
                <p class="text-white/70 text-sm">Has iniciado sesión correctamente</p>
            </div>

            <div class="glass rounded-2xl p-6 mb-6">
                <h3 class="text-white font-semibold mb-4">Información de la cuenta</h3>
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between">
                        <span class="text-white/60">Nombre:</span>
                        <span id="userName" class="text-white font-medium">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-white/60">Email:</span>
                        <span id="userEmail" class="text-white font-medium">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-white/60">UID:</span>
                        <span id="userUid" class="text-white font-medium text-xs">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-white/60">Registrado:</span>
                        <span id="userDate" class="text-white font-medium">-</span>
                    </div>
                </div>
            </div>

            <button id="logoutBtn" class="btn-gradient w-full py-3.5 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i>
                Cerrar Sesión
            </button>
        </div>
    </div>

    <script type="module">
        // Import Firebase SDK v10 modular
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword,
            signInWithPopup,
            GoogleAuthProvider,
            sendPasswordResetEmail,
            signOut,
            updateProfile,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc,
            serverTimestamp 
        } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBKvWZ2jQ0lyrx5xSjFj7fmBaJL1wvBBvU",
            authDomain: "specter-data.firebaseapp.com",
            projectId: "specter-data",
            storageBucket: "specter-data.firebasestorage.app",
            messagingSenderId: "1073862554181",
            appId: "1:1073862554181:web:11d724e7ba0e817885a92c",
            measurementId: "G-28FMY2SW1H"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // DOM Elements
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const googleBtn = document.getElementById('googleBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const alertBox = document.getElementById('alertBox');
        const authContainer = document.getElementById('authContainer');
        const dashboardContainer = document.getElementById('dashboardContainer');
        const forgotPassword = document.getElementById('forgotPassword');

        // Tab Switching
        loginTab.addEventListener('click', () => {
            loginTab.classList.add('tab-active');
            registerTab.classList.remove('tab-active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            hideAlert();
        });

        registerTab.addEventListener('click', () => {
            registerTab.classList.add('tab-active');
            loginTab.classList.remove('tab-active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            hideAlert();
        });

        // Toggle Password Visibility
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector('i');
                if (target.type === 'password') {
                    target.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    target.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });

        // Alert Functions
        function showAlert(message, type = 'error') {
            alertBox.className = 'mb-4 p-3 rounded-xl text-sm slide-in';
            if (type === 'error') {
                alertBox.classList.add('bg-red-500/20', 'text-red-100', 'border', 'border-red-500/30');
            } else if (type === 'success') {
                alertBox.classList.add('bg-green-500/20', 'text-green-100', 'border', 'border-green-500/30');
            } else if (type === 'info') {
                alertBox.classList.add('bg-blue-500/20', 'text-blue-100', 'border', 'border-blue-500/30');
            }
            alertBox.textContent = message;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            alertBox.classList.add('hidden');
        }

        // Loading State
        function setLoading(buttonId, isLoading) {
            const btn = document.getElementById(buttonId);
            const text = document.getElementById(buttonId + 'Text');
            const loader = document.getElementById(buttonId + 'Loader');
            
            if (isLoading) {
                btn.disabled = true;
                text.classList.add('hidden');
                loader.classList.remove('hidden');
            } else {
                btn.disabled = false;
                text.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        }

        // Error Handler
        function getErrorMessage(error) {
            const errorMessages = {
                'auth/email-already-in-use': 'Este correo ya está registrado',
                'auth/invalid-email': 'Correo electrónico inválido',
                'auth/operation-not-allowed': 'Operación no permitida',
                'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres',
                'auth/user-disabled': 'Esta cuenta ha sido deshabilitada',
                'auth/user-not-found': 'No existe una cuenta con este correo',
                'auth/wrong-password': 'Contraseña incorrecta',
                'auth/invalid-credential': 'Credenciales inválidas',
                'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde',
                'auth/network-request-failed': 'Error de conexión. Verifica tu internet',
                'auth/popup-closed-by-user': 'Ventana cerrada antes de completar',
                'auth/cancelled-popup-request': 'Solicitud cancelada'
            };
            return errorMessages[error.code] || `Error: ${error.message}`;
        }

        // Save User to Firestore
        async function saveUserToFirestore(user, name = null) {
            try {
                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);
                
                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        uid: user.uid,
                        email: user.email,
                        displayName: name || user.displayName || 'Usuario',
                        photoURL: user.photoURL || null,
                        createdAt: serverTimestamp(),
                        lastLogin: serverTimestamp(),
                        provider: user.providerData[0]?.providerId || 'email'
                    });
                } else {
                    await setDoc(userRef, {
                        lastLogin: serverTimestamp()
                    }, { merge: true });
                }
            } catch (error) {
                console.error('Error saving user:', error);
            }
        }

        // Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            setLoading('loginBtn', true);

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            try {
                // Set persistence
                await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
                
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                await saveUserToFirestore(userCredential.user);
                showAlert('¡Bienvenido de nuevo!', 'success');
            } catch (error) {
                showAlert(getErrorMessage(error), 'error');
            } finally {
                setLoading('loginBtn', false);
            }
        });

        // Register
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            setLoading('registerBtn', true);

            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            // Validations
            if (password !== confirmPassword) {
                showAlert('Las contraseñas no coinciden', 'error');
                setLoading('registerBtn', false);
                return;
            }

            if (password.length < 6) {
                showAlert('La contraseña debe tener al menos 6 caracteres', 'error');
                setLoading('registerBtn', false);
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                await saveUserToFirestore(userCredential.user, name);
                showAlert('¡Cuenta creada exitosamente!', 'success');
            } catch (error) {
                showAlert(getErrorMessage(error), 'error');
            } finally {
                setLoading('registerBtn', false);
            }
        });

        // Google Sign In
        googleBtn.addEventListener('click', async () => {
            hideAlert();
            setLoading('googleBtn', true);

            try {
                const result = await signInWithPopup(auth, googleProvider);
                await saveUserToFirestore(result.user);
                showAlert('¡Autenticado con Google!', 'success');
            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user') {
                    showAlert(getErrorMessage(error), 'error');
                }
            } finally {
                setLoading('googleBtn', false);
            }
        });

        // Forgot Password
        forgotPassword.addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            
            if (!email) {
                showAlert('Ingresa tu correo electrónico primero', 'info');
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showAlert('Se envió un correo para restablecer tu contraseña', 'success');
            } catch (error) {
                showAlert(getErrorMessage(error), 'error');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                showAlert('Sesión cerrada correctamente', 'success');
            } catch (error) {
                showAlert('Error al cerrar sesión', 'error');
            }
        });

        // Auth State Observer
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User is signed in
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                
                // Get user data from Firestore
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    const userData = userDoc.exists() ? userDoc.data() : {};
                    
                    document.getElementById('userName').textContent = userData.displayName || user.displayName || 'Usuario';
                    document.getElementById('userEmail').textContent = user.email;
                    document.getElementById('userUid').textContent = user.uid;
                    
                    if (userData.createdAt) {
                        const date = userData.createdAt.toDate();
                        document.getElementById('userDate').textContent = date.toLocaleDateString('es-ES', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });
                    } else {
                        document.getElementById('userDate').textContent = 'Hoy';
                    }
                } catch (error) {
                    console.error('Error loading user data:', error);
                }
            } else {
                // User is signed out
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
                loginForm.reset();
                registerForm.reset();
            }
        });
    </script>

</body>
</html>
