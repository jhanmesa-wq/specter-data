<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPECTER DATA — Iniciar sesión</title>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
:root{
  --bg-dark: #0a0f18;
  --card-bg: #101726;
  --input-bg: #141c2c;
  --input-border: #222d42;
  --text-muted: #8893a7;
  --accent-blue: #1c9be8;
  --accent-blue-hover: #1387cd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background-color: var(--bg-dark);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 70px 20px 20px;
}
.back-link{
  position: absolute;
  top: 24px;
  left: 24px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.back-link:hover{color: #fff}

/* Botón de música */
.music-btn{
  position: fixed;
  top: 18px;
  right: 18px;
  display: none;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  color: #fff;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  z-index: 10;
}
.music-btn:hover{border-color: var(--accent-blue)}
.music-btn.playing{background: var(--accent-blue); border-color: var(--accent-blue)}

.auth-box{
  width: 100%;
  max-width: 420px;
  text-align: center;
}

/* Banner / logo */
.logo-container{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 24px;
}
.banner-img{
  display: none;
  width: 100%;
  max-height: 140px;
  object-fit: contain;
  border-radius: 12px;
}
.logo-fallback{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.logo-icon{
  width: 48px;
  height: 48px;
  filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
}
.brand-name{
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: #ffffff;
}
h2{
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 8px;
}
.subtitle{
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 28px;
}
.tabs{
  display: flex;
  background: var(--input-bg);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 22px;
  border: 1px solid var(--input-border);
}
.tab-btn{
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: .2s;
}
.tab-btn.active{
  background: var(--accent-blue);
  color: #fff;
}
.form-group{
  margin-bottom: 16px;
  text-align: left;
}
input{
  width: 100%;
  padding: 16px 20px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 12px;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
}
input:focus{
  border-color: var(--accent-blue);
}
input::placeholder{
  color: #55627a;
}
.hint{
  display: block;
  margin-top: 6px;
  padding-left: 4px;
  font-size: 12px;
  color: var(--text-muted);
}
.hint.bad{color: #f87171}
.hint.ok{color: #4ade80}

/* hCaptcha real */
.captcha-wrap{
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
  min-height: 78px;
}

.btn-submit{
  width: 100%;
  padding: 16px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s, transform .1s;
}
.btn-submit:hover{
  background: var(--accent-blue-hover);
}
.btn-submit:active{
  transform: scale(0.99);
}
.message{
  margin-top: 15px;
  font-size: 14px;
  padding: 10px;
  border-radius: 8px;
  display: none;
}
.message.error{
  display: block;
  background: rgba(239, 68, 68, 0.15);
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.message.success{
  display: block;
  background: rgba(34, 197, 94, 0.15);
  color: #4ade80;
  border: 1px solid rgba(34, 197, 94, 0.3);
}
</style>
</head>
<body>

<a href="index.html" class="back-link">← Volver al sitio principal</a>

<div class="auth-box">
  <div class="logo-container" id="logoContainer">
    <!-- Imagen larga (banner) desde link. Si no hay link o falla, se muestra el logo con texto -->
    <img class="banner-img" id="bannerImg" alt="SPECTER DATA">
    <div class="logo-fallback" id="logoFallback">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a4 4 0 0 0-4 4v1H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z"/>
        <circle cx="12" cy="13" r="3"/>
        <path d="M12 16v2"/>
      </svg>
      <span class="brand-name">SPECTER DATA</span>
    </div>
  </div>

  <h2 id="formTitle">Bienvenido de nuevo</h2>
  <p class="subtitle" id="formSubtitle">Ingresa con tus credenciales</p>
  <!-- Botón para pausar / reproducir la música -->
<button type="button" class="music-btn" id="musicBtn">🎵 <span id="musicLabel">Reproducir música</span></button>
<audio id="bgMusic" loop preload="auto"></audio>
  
 <div class="tabs">
    <button class="tab-btn active" id="tabLogin" type="button">Ingresar</button>
    <button class="tab-btn" id="tabRegister" type="button">Registrarse</button>
  </div>

  <form id="authForm" autocomplete="off" novalidate>
    <div class="form-group">
      <input type="text" id="username" placeholder="Usuario (mínimo 5 caracteres)" minlength="5" maxlength="30" required>
      <span class="hint" id="userHint"></span>
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="Contraseña (mínimo 7 caracteres)" minlength="7" maxlength="64" required>
      <span class="hint" id="passHint"></span>
    </div>

    <!-- hCaptcha REAL -->
    <div class="captcha-wrap">
      <div class="h-captcha" id="hcaptchaBox" data-sitekey="10000000-ffff-ffff-ffff-000000000001" data-theme="dark"></div>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">Ingresar</button>
    <div id="msgBox" class="message"></div>
  </form>
</div>

<script>
/* ================= CONFIGURACIÓN (edita solo esto) ================= */
const CONFIG = {
  // Link de la imagen larga (banner). Déjalo vacío "" para mostrar el texto SPECTER DATA.
  BANNER_URL: "https://files.catbox.moe/x01jky.jpg",
  // Link directo al archivo de música (.mp3, .ogg, .wav). Déjalo vacío "" para no usar música.
  MUSIC_URL: "https://files.catbox.moe/zo9w0g.m4a",
  // Volumen inicial de la música (0 a 1)
  MUSIC_VOLUME: 0.5,
  // Reglas del formulario
  MIN_USER: 5,
  MIN_PASS: 7
};
/* =================================================================== */

let mode = "login"; // 'login' o 'register'

const formTitle = document.getElementById("formTitle");
const formSubtitle = document.getElementById("formSubtitle");
const tabLogin = document.getElementById("tabLogin");
const tabRegister = document.getElementById("tabRegister");
const btnSubmit = document.getElementById("btnSubmit");
const msgBox = document.getElementById("msgBox");
const userInput = document.getElementById("username");
const passInput = document.getElementById("password");
const userHint = document.getElementById("userHint");
const passHint = document.getElementById("passHint");

/* ---------- Banner ---------- */
(function initBanner(){
  if (!CONFIG.BANNER_URL) return;
  const img = document.getElementById("bannerImg");
  const fallback = document.getElementById("logoFallback");
  img.onload = () => {
    img.style.display = "block";
    fallback.style.display = "none";
  };
  img.onerror = () => {
    img.style.display = "none";
    fallback.style.display = "flex";
  };
  img.src = CONFIG.BANNER_URL;
})();

/* ---------- Música ---------- */
(function initMusic(){
  if (!CONFIG.MUSIC_URL) return;
  const audio = document.getElementById("bgMusic");
  const btn = document.getElementById("musicBtn");
  const label = document.getElementById("musicLabel");
  let userPaused = false;

  audio.src = CONFIG.MUSIC_URL;
  audio.volume = CONFIG.MUSIC_VOLUME;
  btn.style.display = "flex";



  function tryPlay(){
    return audio.play().then(refresh).catch(refresh);
  }

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (audio.paused) {
      userPaused = false;
      tryPlay();
    } else {
      userPaused = true;
      audio.pause();
      refresh();
    }
  });

  audio.addEventListener("play", refresh);
  audio.addEventListener("pause", refresh);
  audio.addEventListener("error", () => {
    label.textContent = "Música no disponible";
  });

  // Intento de autoplay; si el navegador lo bloquea, arranca en la primera interacción
  tryPlay();
  const startOnInteraction = () => {
    if (audio.paused && !userPaused) tryPlay();
    document.removeEventListener("click", startOnInteraction);
    document.removeEventListener("keydown", startOnInteraction);
    document.removeEventListener("touchstart", startOnInteraction);
  };
  document.addEventListener("click", startOnInteraction);
  document.addEventListener("keydown", startOnInteraction);
  document.addEventListener("touchstart", startOnInteraction);
})();

/* ---------- Pestañas ---------- */
function setMode(newMode){
  mode = newMode;
  const isLogin = mode === "login";
  tabLogin.classList.toggle("active", isLogin);
  tabRegister.classList.toggle("active", !isLogin);
  formTitle.textContent = isLogin ? "Bienvenido de nuevo" : "Crea tu cuenta";
  formSubtitle.textContent = isLogin ? "Ingresa con tus credenciales" : "Regístrate con tu usuario y contraseña";
  btnSubmit.textContent = isLogin ? "Ingresar" : "Crear Cuenta";
  msgBox.className = "message";
  msgBox.textContent = "";
  updateHints();
}
tabLogin.addEventListener("click", () => setMode("login"));
tabRegister.addEventListener("click", () => setMode("register"));

/* ---------- Validación en vivo ---------- */
function updateHints(){
  // Las ayudas de longitud se muestran en el registro; en el login solo al escribir
  const u = userInput.value.trim().length;
  const p = passInput.value.length;

  if (u === 0) {
    userHint.textContent = "";
    userHint.className = "hint";
  } else if (u < CONFIG.MIN_USER) {
    userHint.textContent = `Faltan ${CONFIG.MIN_USER - u} caracteres (mínimo ${CONFIG.MIN_USER}).`;
    userHint.className = "hint bad";
  } else {
    userHint.textContent = "✓ Usuario válido";
    userHint.className = "hint ok";
  }

  if (p === 0) {
    passHint.textContent = "";
    passHint.className = "hint";
  } else if (p < CONFIG.MIN_PASS) {
    passHint.textContent = `Faltan ${CONFIG.MIN_PASS - p} caracteres (mínimo ${CONFIG.MIN_PASS}).`;
    passHint.className = "hint bad";
  } else {
    passHint.textContent = "✓ Contraseña válida";
    passHint.className = "hint ok";
  }
}
userInput.addEventListener("input", updateHints);
passInput.addEventListener("input", updateHints);

/* ---------- Usuarios (LocalStorage) ---------- */
function getUsers() {
  try {
    const users = localStorage.getItem("specter_users");
    return users ? JSON.parse(users) : {};
  } catch (e) {
    return {};
  }
}
function saveUsers(users) {
  localStorage.setItem("specter_users", JSON.stringify(users));
}

function resetCaptcha(){
  try { if (window.hcaptcha) hcaptcha.reset(); } catch (e) {}
}

/* ---------- Envío ---------- */
document.getElementById("authForm").addEventListener("submit", (e) => {
  e.preventDefault();
  msgBox.className = "message";
  msgBox.textContent = "";

  const user = userInput.value.trim();
  const pass = passInput.value;

  if (!user || !pass) {
    showMsg("Completa todos los campos.", "error");
    return;
  }
  if (user.length < CONFIG.MIN_USER) {
    showMsg(`El usuario debe tener al menos ${CONFIG.MIN_USER} caracteres.`, "error");
    return;
  }
  if (pass.length < CONFIG.MIN_PASS) {
    showMsg(`La contraseña debe tener al menos ${CONFIG.MIN_PASS} caracteres.`, "error");
    return;
  }

  // Verificación del captcha real: debe existir un token generado por hCaptcha
  let token = "";
  try { token = window.hcaptcha ? hcaptcha.getResponse() : ""; } catch (err) {}
  if (!token) {
    showMsg("Resuelve el captcha para continuar.", "error");
    return;
  }

  const users = getUsers();

  if (mode === "register") {
    if (users[user.toLowerCase()]) {
      showMsg("El usuario ya existe. Elige otro nombre.", "error");
      resetCaptcha();
      return;
    }
    users[user.toLowerCase()] = { username: user, password: pass };
    saveUsers(users);
    showMsg("¡Cuenta creada exitosamente! Iniciando sesión...", "success");

    localStorage.setItem("specter_logged_user", user);
    setTimeout(() => { window.location.href = "consultas.html"; }, 1200);

  } else {
    const account = users[user.toLowerCase()];
    if (!account || account.password !== pass) {
      showMsg("Usuario o contraseña incorrectos.", "error");
      resetCaptcha();
      return;
    }
    localStorage.setItem("specter_logged_user", account.username);
    showMsg("Credenciales correctas. Ingresando...", "success");
    setTimeout(() => { window.location.href = "consultas.html"; }, 800);
  }
});

function showMsg(text, type) {
  msgBox.textContent = text;
  msgBox.className = `message ${type}`;
}
</script>
</body>
</html>
