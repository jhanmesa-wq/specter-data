<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPECTER DATA — Iniciar sesión</title>
<style>
:root{
  --bg-dark: #0a0f18;
  --card-bg: #101726;
  --input-bg: #141c2c;
  --input-border: #222d42;
  --text-muted: #8893a7;
  --accent-blue: #1c9be8;
  --accent-blue-hover: #1387cd;
  --hcaptcha-bg: #172235;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background-color: var(--bg-dark);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.back-link{
  position: absolute;
  top: 24px;
  left: 24px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.back-link:hover{color: #fff}
.auth-box{
  width: 100%;
  max-width: 420px;
  text-align: center;
}
.logo-container{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 24px;
}
.logo-icon{
  width: 48px;
  height: 48px;
  filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
}
.brand-name{
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: #ffffff;
}
h2{
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 8px;
}
.subtitle{
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 28px;
}
.tabs{
  display: flex;
  background: var(--input-bg);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 22px;
  border: 1px solid var(--input-border);
}
.tab-btn{
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: .2s;
}
.tab-btn.active{
  background: var(--accent-blue);
  color: #fff;
}
.form-group{
  margin-bottom: 16px;
  text-align: left;
}
input{
  width: 100%;
  padding: 16px 20px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 12px;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
}
input:focus{
  border-color: var(--accent-blue);
}
input::placeholder{
  color: #55627a;
}
/* hCaptcha Mockup Box */
.captcha-box{
  background: var(--hcaptcha-bg);
  border: 1px solid var(--input-border);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  user-select: none;
  cursor: pointer;
}
.captcha-left{
  display: flex;
  align-items: center;
  gap: 14px;
}
.captcha-check{
  width: 26px;
  height: 26px;
  border: 2px solid #3c4b66;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111a28;
  transition: all .2s;
}
.captcha-box.checked .captcha-check{
  background: #0ea5e9;
  border-color: #0ea5e9;
}
.captcha-check svg{
  width: 16px;
  height: 16px;
  fill: none;
  stroke: #fff;
  stroke-width: 3;
  display: none;
}
.captcha-box.checked .captcha-check svg{
  display: block;
}
.captcha-text{
  font-size: 15px;
  color: #d1d5db;
}
.captcha-right{
  text-align: center;
}
.captcha-logo{
  width: 32px;
  height: 32px;
  display: inline-block;
  background: linear-gradient(135deg, #00acc1, #0288d1);
  border-radius: 5px;
  position: relative;
  overflow: hidden;
}
.captcha-logo::after{
  content: "✋";
  font-size: 18px;
  line-height: 32px;
  display: block;
}
.captcha-info{
  font-size: 9px;
  color: #7d899d;
  display: block;
  margin-top: 2px;
}
.btn-submit{
  width: 100%;
  padding: 16px;
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background .2s, transform .1s;
}
.btn-submit:hover{
  background: var(--accent-blue-hover);
}
.btn-submit:active{
  transform: scale(0.99);
}
.message{
  margin-top: 15px;
  font-size: 14px;
  padding: 10px;
  border-radius: 8px;
  display: none;
}
.message.error{
  display: block;
  background: rgba(239, 68, 68, 0.15);
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.message.success{
  display: block;
  background: rgba(34, 197, 94, 0.15);
  color: #4ade80;
  border: 1px solid rgba(34, 197, 94, 0.3);
}
</style>
</head>
<body>

<a href="index.html" class="back-link">← Volver al sitio principal</a>

<div class="auth-box">
  <div class="logo-container">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a4 4 0 0 0-4 4v1H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z"/>
      <circle cx="12" cy="13" r="3"/>
      <path d="M12 16v2"/>
    </svg>
    <span class="brand-name">SPECTER DATA</span>
  </div>

  <h2 id="formTitle">Bienvenido de nuevo</h2>
  <p class="subtitle" id="formSubtitle">Ingresa con tus credenciales</p>

  <div class="tabs">
    <button class="tab-btn active" id="tabLogin" type="button">Ingresar</button>
    <button class="tab-btn" id="tabRegister" type="button">Registrarse</button>
  </div>

  <form id="authForm" autocomplete="off">
    <div class="form-group">
      <input type="text" id="username" placeholder="Usuario" required>
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="Contraseña" required>
    </div>

    <!-- Captcha interactivo -->
    <div class="captcha-box" id="captchaBox">
      <div class="captcha-left">
        <div class="captcha-check" id="captchaCheck">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <span class="captcha-text">Soy humano</span>
      </div>
      <div class="captcha-right">
        <div class="captcha-logo"></div>
        <span class="captcha-info">hCaptcha<br>Privacidad - Condiciones</span>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">Ingresar</button>
    <div id="msgBox" class="message"></div>
  </form>
</div>

<script>
let mode = "login"; // 'login' o 'register'
let captchaPassed = false;

const formTitle = document.getElementById("formTitle");
const formSubtitle = document.getElementById("formSubtitle");
const tabLogin = document.getElementById("tabLogin");
const tabRegister = document.getElementById("tabRegister");
const btnSubmit = document.getElementById("btnSubmit");
const msgBox = document.getElementById("msgBox");
const captchaBox = document.getElementById("captchaBox");

// Cambiar de pestaña
tabLogin.addEventListener("click", () => {
  mode = "login";
  tabLogin.classList.add("active");
  tabRegister.classList.remove("active");
  formTitle.textContent = "Bienvenido de nuevo";
  formSubtitle.textContent = "Ingresa con tus credenciales";
  btnSubmit.textContent = "Ingresar";
  msgBox.className = "message";
  msgBox.textContent = "";
});

tabRegister.addEventListener("click", () => {
  mode = "register";
  tabRegister.classList.add("active");
  tabLogin.classList.remove("active");
  formTitle.textContent = "Crea tu cuenta";
  formSubtitle.textContent = "Regístrate con tu usuario y contraseña";
  btnSubmit.textContent = "Crear Cuenta";
  msgBox.className = "message";
  msgBox.textContent = "";
});

// Click en Captcha
captchaBox.addEventListener("click", () => {
  captchaPassed = !captchaPassed;
  captchaBox.classList.toggle("checked", captchaPassed);
});

// Guardado y verificación en LocalStorage
function getUsers() {
  const users = localStorage.getItem("specter_users");
  return users ? JSON.parse(users) : {};
}

function saveUsers(users) {
  localStorage.setItem("specter_users", JSON.stringify(users));
}

document.getElementById("authForm").addEventListener("submit", (e) => {
  e.preventDefault();
  msgBox.className = "message";
  msgBox.textContent = "";

  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (!user || !pass) {
    showMsg("Completa todos los campos.", "error");
    return;
  }

  if (!captchaPassed) {
    showMsg("Por favor, marca la casilla 'Soy humano'.", "error");
    return;
  }

  const users = getUsers();

  if (mode === "register") {
    // Si ya existe el usuario
    if (users[user.toLowerCase()]) {
      showMsg("El usuario ya existe. Elige otro nombre.", "error");
      return;
    }
    // Registrar
    users[user.toLowerCase()] = { username: user, password: pass };
    saveUsers(users);
    showMsg("¡Cuenta creada exitosamente! Iniciando sesión...", "success");

    localStorage.setItem("specter_logged_user", user);
    setTimeout(() => {
      window.location.href = "consultas.html";
    }, 1200);

  } else {
    // Iniciar Sesión
    const account = users[user.toLowerCase()];
    if (!account || account.password !== pass) {
      showMsg("Usuario o contraseña incorrectos.", "error");
      return;
    }
    
    localStorage.setItem("specter_logged_user", account.username);
    showMsg("Credenciales correctas. Ingresando...", "success");
    setTimeout(() => {
      window.location.href = "consultas.html";
    }, 800);
  }
});

function showMsg(text, type) {
  msgBox.textContent = text;
  msgBox.className = `message ${type}`;
}
</script>
</body>
  </html>
